__include__: [
  '../deim_rtdetrv2/rtdetrv2_r18vd_120e_coco.yml',
  '../base/rt_deim.yml',
]







use_amp: True
evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', 'segm']

output_dir: ./output/exp_binary_mask_36e
num_classes: 8

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.0001

epoches: 36
flat_epoch: 1
no_aug_epoch: 0

train_dataloader:
  total_batch_size: 2
  dataset:
    return_masks: False
    img_folder: datasets/livecell/images/livecell_trainimages/
    ann_file: datasets/livecell/annotations/livecell_coco_train.json
    transforms:
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy: ~
  collate_fn:
    type: BatchImageCollateFunction
    mixup_prob: 0.0

val_dataloader:
  total_batch_size: 2
  dataset:
    return_masks: True
    img_folder: datasets/livecell/images/livecell_valimages/
    ann_file: datasets/livecell/annotations/livecell_coco_val.json


RTDETRTransformerv2:
  use_binary_mask_head: True
  mask_grid_size: 16



DEIMCriterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_sdf: 0.0, loss_mask: 0.5}
  losses: ['vfl', 'boxes', 'binary_masks']
  pca_dim: 256
  alpha: 0.75



PostProcessor:
  num_top_queries: 300
  pca_model_path: 'cell_pca_model.pkl'
  mask_source: 'binary'
